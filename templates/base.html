<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}AIチャットアプリ{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        .gradient-bg {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
        .chat-container {
            height: 60vh;
            overflow-y: auto;
        }
        .message-bubble {
            max-width: 80%;
            word-wrap: break-word;
        }
        .user-message {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        .ai-message {
            background: #f8f9fa;
            border: 1px solid #e9ecef;
        }
        .typing-indicator {
            display: none;
        }
        .typing-indicator.show {
            display: block;
        }
        .feature-card {
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }
        .feature-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
        }
    </style>
    {% block extra_css %}{% endblock %}
</head>
<body class="bg-gray-50">
    <!-- ナビゲーション -->
    <nav class="bg-white shadow-lg">
        <div class="max-w-7xl mx-auto px-4">
            <div class="flex justify-between items-center py-4">
                <div class="flex items-center">
                    <a href="{% url 'chat:home' %}" class="text-2xl font-bold text-gray-800">
                        <i class="fas fa-robot text-blue-600 mr-2"></i>
                        AIチャット
                    </a>
                </div>
                <div class="hidden md:flex space-x-8">
                    <a href="{% url 'chat:home' %}" class="text-gray-600 hover:text-blue-600 transition duration-300">ホーム</a>
                    <a href="{% url 'chat:about' %}" class="text-gray-600 hover:text-blue-600 transition duration-300">アバウト</a>
                    <a href="{% url 'chat:contact' %}" class="text-gray-600 hover:text-blue-600 transition duration-300">お問い合わせ</a>
                </div>
                <div class="md:hidden">
                    <button class="text-gray-600 hover:text-blue-600" onclick="toggleMobileMenu()">
                        <i class="fas fa-bars text-xl"></i>
                    </button>
                </div>
            </div>
            <!-- モバイルメニュー -->
            <div id="mobile-menu" class="hidden md:hidden pb-4">
                <a href="{% url 'chat:home' %}" class="block py-2 text-gray-600 hover:text-blue-600">ホーム</a>
                <a href="{% url 'chat:about' %}" class="block py-2 text-gray-600 hover:text-blue-600">アバウト</a>
                <a href="{% url 'chat:contact' %}" class="block py-2 text-gray-600 hover:text-blue-600">お問い合わせ</a>
            </div>
        </div>
    </nav>

    <!-- メインコンテンツ -->
    <main>
        {% block content %}{% endblock %}
    </main>

    <!-- フッター -->
    <footer class="bg-gray-800 text-white py-8">
        <div class="max-w-7xl mx-auto px-4">
            <div class="grid grid-cols-1 md:grid-cols-3 gap-8">
                <div>
                    <h3 class="text-xl font-bold mb-4">AIチャット</h3>
                    <p class="text-gray-300">最新のAI技術を活用したチャットアプリケーション</p>
                </div>
                <div>
                    <h4 class="text-lg font-semibold mb-4">リンク</h4>
                    <ul class="space-y-2">
                        <li><a href="{% url 'chat:home' %}" class="text-gray-300 hover:text-white">ホーム</a></li>
                        <li><a href="{% url 'chat:about' %}" class="text-gray-300 hover:text-white">アバウト</a></li>
                        <li><a href="{% url 'chat:contact' %}" class="text-gray-300 hover:text-white">お問い合わせ</a></li>
                    </ul>
                </div>
                <div>
                    <h4 class="text-lg font-semibold mb-4">お問い合わせ</h4>
                    <p class="text-gray-300">ご質問やご要望がございましたら、お気軽にお問い合わせください。</p>
                </div>
            </div>
            <div class="border-t border-gray-700 mt-8 pt-8 text-center">
                <p class="text-gray-300">&copy; 2024 AIチャット. All rights reserved.</p>
            </div>
        </div>
    </footer>

    <script>
        function toggleMobileMenu() {
            const menu = document.getElementById('mobile-menu');
            menu.classList.toggle('hidden');
        }
    </script>
    {% block extra_js %}{% endblock %}
</body>
</html>
